- name: install ansible
  hosts: all
  become: yes
  tasks:
  - name: install ansible
    ansible.builtin.dnf:
      name: ansible
      state: installed
  - name: install nginx
    ansible.builtin.dnf:
      name: nginx
      state: installed
  - name: Run nginx
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes