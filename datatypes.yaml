- name: Datatypes
  hosts: localhost
  vars:
    Course: Devops with AWS
    Tools:
    - Linux
    - shell
    - ansible
    Experience:
      Devops: 3
      AWS: 3
      Docker: 1
    RealProject: true
  tasks:
  - name: print variables
    ansible.builtin.debug:
      msg: "Course: {{Course}}, Tools covered: {{Tools}}, Experience is : {{Experience}}, is real project: {{RealProject}}"
      